<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariyah Chavez Personal Webpage</title>

    <!-- External Links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.45/dist/vue.global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">

    <style>
        /* Page Styles */
        body {
            background-color: black;
            color: #9374C0;
            font-family: 'Jersey 10', serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        ul {
            list-style: none;
            padding: 0;
            text-align: center;
        }

        li {
            margin: 10px 0;
        }

        a {
            text-decoration: none;
            color: #f4f1f5; /* Bright yellow for links */
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #3a77fa; /* Orange on hover */
        }

        .back-container {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .back-icon {
            width: 32px; /* Adjust size */
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .back-icon:hover {
            transform: scale(1.1); /* Slightly enlarge on hover */
        }
    </style>
</head>

<body>
    <!-- Back Arrow -->
    <div class="back-container">
        <a href="index.html">
            <img src="images/back arrow icon.png" alt="Back" class="back-icon">
        </a>
    </div>

    <!-- Title -->
    <h1>Resources</h1>

    <!-- Resource Links -->
    <ul>
        <li><a href="https://example.com/resource1" target="_blank">Resources 1</a></li>
        <li><a href="https://example.com/resource2" target="_blank">Resources 2</a></li>
        <li><a href="https://example.com/resource3" target="_blank">Resources 3</a></li>
        <li><a href="https://example.com/resource4" target="_blank">Resources 4</a></li>
    </ul>
</body>

</html>
